<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALŞ10 - Birleşik PWA</title>
    <link rel="manifest" href="manifest.json">
    <!-- Font Awesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --success-hover: #059669;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        .app-container { 
            width: 100%; 
            max-width: 500px; 
            background: var(--card-bg); 
            border-radius: 24px; 
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1), 0 0 20px rgba(0,0,0,0.02); 
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #818CF8);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .content { padding: 25px; }

        .hidden { display: none !important; }

        /* Butonlar */
        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        
        .btn:active { transform: scale(0.98); }
        
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-success:hover { background: var(--success-hover); }
        
        .btn-danger { background: #FEE2E2; color: var(--danger); margin-bottom: 20px; }
        .btn-danger:hover { background: #FECACA; }

        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #EEF2FF; }

        /* Kartlar ve Kutular */
        .card { 
            background: #F9FAFB; 
            border: 1px solid #E5E7EB; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
        }

        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .card p { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; }

        /* Input */
        input[type="text"], input[type="file"] {
            width: 100%; padding: 14px; border: 1px solid #D1D5DB; border-radius: 12px; font-size: 14px; margin-bottom: 12px; background: white;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* Durum ve İlerleme */
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #E0E7FF; color: var(--primary); margin-bottom: 15px; }
        
        .progress-container { width: 100%; background: #E5E7EB; border-radius: 10px; height: 12px; overflow: hidden; margin-top: 15px; display: none; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.3s ease; }

        /* QR Alanları */
        #qr-reader { width: 100%; border-radius: 16px; overflow: hidden; border: 2px dashed #D1D5DB; margin-bottom: 15px; }
        #qrcode-hoca { display: flex; justify-content: center; margin: 20px 0; padding: 15px; background: white; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* Flex Row */
        .flex-row { display: flex; gap: 10px; }
        .flex-row .btn { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- HEADER -->
    <div class="header">
        <h1><i class="fa-solid fa-layer-group"></i> ALŞ10</h1>
        <p>Birleşik PWA Uygulaması</p>
    </div>

    <div class="content">
        <!-- ANA EKRAN -->
        <div id="ana-ekran">
            <p style="text-align: center; margin-bottom: 20px; font-weight: 500;">Lütfen bir işlem seçin</p>
            <button onclick="uygulamaAc('als08')" class="btn btn-success"><i class="fa-solid fa-tower-broadcast"></i> ALŞ08 - Web/Mobil P2P</button>
            <button onclick="uygulamaAc('als09')" class="btn btn-primary"><i class="fa-solid fa-qrcode"></i> ALŞ09 - Dosya Transferi</button>
        </div>

        <!-- ALŞ08 EKRANI -->
        <div id="als08-ekran" class="hidden">
            <button class="btn btn-danger" onclick="anaEkranaDon()"><i class="fa-solid fa-arrow-left"></i> Ana Ekrana Dön</button>
            
            <div class="card">
                <h3><i class="fa-solid fa-link" style="color:var(--primary)"></i> P2P Bağlantı Yönetimi</h3>
                <span id="my-id" class="status-badge">ID: Oluşturuluyor...</span>
                <input type="text" id="peer-id-input" placeholder="Karşı tarafın ID'sini girin...">
                <button onclick="baglan()" class="btn btn-outline"><i class="fa-solid fa-plug"></i> Bağlan</button>
            </div>
            
            <div class="card">
                <h3><i class="fa-solid fa-paper-plane" style="color:var(--success)"></i> Dosya Gönder</h3>
                <input type="file" id="file-input">
                <button onclick="dosyaGonder()" class="btn btn-success"><i class="fa-solid fa-upload"></i> Gönder</button>
                <div id="progress-container" class="progress-container">
                    <div id="progress" class="progress-bar"></div>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-download" style="color:#F59E0B"></i> Gelen Dosyalar</h3>
                <div id="gelen-dosyalar" style="font-size: 14px;">
                    <p style="color: var(--text-muted);">Henüz dosya alınmadı.</p>
                </div>
            </div>
        </div>

        <!-- ALŞ09 EKRANI -->
        <div id="als09-ekran" class="hidden">
            <button class="btn btn-danger" onclick="anaEkranaDon()"><i class="fa-solid fa-arrow-left"></i> Ana Ekrana Dön</button>
            
            <div class="card">
                <h3><i class="fa-solid fa-users" style="color:var(--primary)"></i> Rol Seçimi</h3>
                <div class="flex-row">
                    <button onclick="modSec('hoca')" class="btn btn-outline">Hoca Modu</button>
                    <button onclick="modSec('ogrenci')" class="btn btn-outline">Öğrenci Modu</button>
                </div>
            </div>

            <!-- HOCA MODU -->
            <div id="hoca-mod" class="hidden card" style="border-color: var(--primary);">
                <h3><i class="fa-solid fa-chalkboard-user" style="color:var(--primary)"></i> Hoca Modu</h3>
                <p>Öğrenciler bu QR kodu okutarak size bağlanabilir.</p>
                <div id="qrcode-hoca"></div>
                <button onclick="qrKodUret()" class="btn btn-primary">QR Kod Oluştur</button>
            </div>

            <!-- ÖĞRENCİ MODU -->
            <div id="ogrenci-mod" class="hidden card" style="border-color: var(--success);">
                <h3><i class="fa-solid fa-user-graduate" style="color:var(--success)"></i> Öğrenci Modu</h3>
                <p>Hocanın QR kodunu kamera ile okutun.</p>
                <div id="qr-reader"></div>
                <button onclick="kameraAc()" class="btn btn-success">Kamerayı Aç</button>
                <div id="qr-result" class="hidden" style="margin-top: 15px; text-align: center;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Kütüphaneler (Javascript) -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
    // --- SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log("SW Hatası:", err));
    }

    // --- YÖNLENDİRME MANTIĞI ---
    function uygulamaAc(uygulama) {
        document.getElementById('ana-ekran').classList.add('hidden');
        document.getElementById(uygulama + '-ekran').classList.remove('hidden');
    }

    function anaEkranaDon() {
        document.getElementById('als08-ekran').classList.add('hidden');
        document.getElementById('als09-ekran').classList.add('hidden');
        document.getElementById('ana-ekran').classList.remove('hidden');
        
        if(window.html5QrCode) { window.html5QrCode.stop().catch(e => {}); }
        if(window.peer) { window.peer.destroy(); }
        
        // Ana ekrana dönünce PeerJS'i yeniden başlat (yeni ID almak için)
        setTimeout(peerBaslat, 500);
    }

    // ==========================================
    // ALŞ08 & ALŞ09: WebRTC (PeerJS) ve P2P
    // ==========================================
    let peer, conn;
    const CHUNK_SIZE = 16 * 1024; // 16KB Parçalama

    function peerBaslat() {
        peer = new Peer(); 
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = "ID: " + id;
        });
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });
    }
    peerBaslat();

    function baglan() {
        const targetId = document.getElementById('peer-id-input').value;
        if(!targetId) return alert("Lütfen bir ID girin!");
        conn = peer.connect(targetId);
        setupConnection();
    }

    function setupConnection() {
        conn.on('open', () => {
            alert("P2P Bağlantı Başarıyla Kuruldu!");
        });

        let receivedChunks = [];
        let receivedFileName = "";

        conn.on('data', (data) => {
            if (data.type === 'meta') {
                receivedFileName = data.name;
                receivedChunks = [];
                document.getElementById('progress-container').style.display = 'block';
            } else if (data.type === 'chunk') {
                receivedChunks.push(data.data);
                let progress = Math.round((receivedChunks.length * CHUNK_SIZE / data.totalSize) * 100);
                if(progress > 100) progress = 100;
                document.getElementById('progress').style.width = progress + "%";
            } else if (data.type === 'done') {
                const blob = new Blob(receivedChunks);
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = receivedFileName;
                link.innerHTML = `<i class="fa-solid fa-file-arrow-down"></i> İndir: ` + receivedFileName;
                link.style.display = "block";
                link.style.color = "var(--primary)";
                link.style.textDecoration = "none";
                link.style.padding = "10px 0";
                
                document.getElementById('gelen-dosyalar').innerHTML = "";
                document.getElementById('gelen-dosyalar').appendChild(link);
                
                alert("Dosya başarıyla alındı!");
                setTimeout(() => { document.getElementById('progress-container').style.display = 'none'; document.getElementById('progress').style.width = "0%"; }, 2000);
            }
        });
    }

    function dosyaGonder() {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        if (!file) return alert("Lütfen bir dosya seçin!");
        if (!conn || !conn.open) return alert("Önce P2P bağlantısı kurun!");

        document.getElementById('progress-container').style.display = 'block';
        conn.send({ type: 'meta', name: file.name, size: file.size });

        let offset = 0;
        const reader = new FileReader();

        reader.onload = (e) => {
            if (e.target.readyState === FileReader.DONE) {
                conn.send({ type: 'chunk', data: e.target.result, totalSize: file.size });
                offset += e.target.result.byteLength;
                
                let progress = Math.round((offset / file.size) * 100);
                document.getElementById('progress').style.width = progress + "%";

                if (offset < file.size) {
                    readSlice(offset);
                } else {
                    conn.send({ type: 'done' });
                    alert("Dosya başarıyla gönderildi!");
                    setTimeout(() => { document.getElementById('progress-container').style.display = 'none'; document.getElementById('progress').style.width = "0%"; }, 2000);
                }
            }
        };

        const readSlice = (o) => {
            const slice = file.slice(o, o + CHUNK_SIZE);
            reader.readAsArrayBuffer(slice);
        };
        readSlice(0);
    }

    // ==========================================
    // QR KOD İŞLEMLERİ
    // ==========================================
    function modSec(mod) {
        document.getElementById('hoca-mod').classList.add('hidden');
        document.getElementById('ogrenci-mod').classList.add('hidden');
        document.getElementById(mod + '-mod').classList.remove('hidden');
    }

    function qrKodUret() {
        const myId = peer.id;
        if(!myId) return alert("ID henüz oluşmadı, lütfen bekleyin.");
        
        document.getElementById("qrcode-hoca").innerHTML = "";
        new QRCode(document.getElementById("qrcode-hoca"), {
            text: myId,
            width: 200,
            height: 200,
            colorDark : "#1F2937",
            colorLight : "#ffffff",
        });
    }

    let html5QrCode;
    function kameraAc() {
        document.getElementById('qr-result').classList.add('hidden');
        if(!html5QrCode) { html5QrCode = new Html5Qrcode("qr-reader"); }
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                html5QrCode.stop();
                document.getElementById('qr-result').classList.remove('hidden');
                document.getElementById('qr-result').innerHTML = `
                    <p style="color:var(--success); font-weight:600; margin-bottom:10px;">Hoca ID Okundu!</p>
                    <button onclick="otomatikBaglan('${decodedText}')" class="btn btn-success">Hocaya Bağlan</button>`;
            },
            (err) => { /* Hata yoksay */ }
        ).catch(err => alert("Kamera açılamadı: " + err));
    }

    function otomatikBaglan(targetId) {
        document.getElementById('qr-result').classList.add('hidden');
        uygulamaAc('als08'); 
        document.getElementById('peer-id-input').value = targetId;
        baglan();
    }
</script>

</body>
</html>
